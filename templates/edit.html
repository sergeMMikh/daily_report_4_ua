<!doctype html><html lang="{{ language }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ t.edit_title }}</title><style>body{margin:0;background:#f3f5f8;color:#172033;font:15px Segoe UI,Arial}.box{max-width:900px;margin:40px auto;background:#fff;padding:30px;border-radius:18px;box-shadow:0 10px 30px #17203312}h1{margin-top:0}.top{display:flex;gap:15px}.field{flex:1}label{display:block;font-weight:700;margin:12px 0 6px}input,textarea{width:100%;box-sizing:border-box;border:1px solid #dce1e8;border-radius:9px;padding:11px;font:inherit}textarea{min-height:190px;resize:vertical}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:9px;padding:10px 16px;background:#f5b82e;color:#172033;font-weight:700;text-decoration:none;cursor:pointer}.cancel{background:#edf0f4}</style></head><body><main class="box"><h1>{{ t.edit_title }}</h1><form method="post"><div class="top"><div class="field"><label>{{ t.date }}</label><input type="date" name="date" value="{{ occurred.strftime('%Y-%m-%d') }}" required></div><div class="field"><label>{{ t.time }}</label><input type="time" name="time" value="{{ occurred.strftime('%H:%M') }}" required></div></div>{% if report.description_source %}<label>{{ t.source }}</label><textarea name="description_source">{{ report.description_source }}</textarea>{% endif %}<label>{{ t.pt }}</label><textarea name="description_pt" required>{{ report.description_pt }}</textarea><div class="actions"><button class="btn">{{ t.save }}</button><a class="btn cancel" href="{{ url_for('index') }}">{{ t.cancel }}</a></div></form></main></body></html>
